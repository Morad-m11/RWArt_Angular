<div class="page">
    <div style="display: flex; justify-content: space-between">
        <a class="link home-link" routerLink="/">
            <app-icon-text>
                <img src="public/ArtShelter.png" alt="Logo" width="32" />
                <span>Art Shelter</span>
            </app-icon-text>
        </a>

        <div class="button-group">
            <app-profile-button />

            <button
                class="rw-btn"
                #origin="cdkOverlayOrigin"
                cdkOverlayOrigin
                (click)="isOpen = !isOpen"
            >
                Feedback
            </button>
            <button class="rw-btn" routerLink="/post/create">Create Post</button>
        </div>

        <ng-template
            cdkConnectedOverlay
            [cdkConnectedOverlayOrigin]="origin"
            [cdkConnectedOverlayOpen]="isOpen"
            cdkConnectedOverlayWidth="250px"
            cdkConnectedOverlayPanelClass="dialog-outlined"
            cdkConnectedOverlayBackdropClass="transparent"
            (overlayOutsideClick)="isOpen = false"
            (detach)="isOpen = false"
        >
            <div class="feedback-overlay">
                <textarea
                    [(ngModel)]="feedback"
                    appTyping
                    breakAfterSentences
                    placeholder="Have an idea? Any issues? Let me know"
                    class="textarea"
                ></textarea>
                <button
                    class="rw-btn"
                    [class.success]="sentFeedback()"
                    style="font-size: 0.6rem; text-align: start"
                    [disabled]="feedback.length < 5 || loading()"
                    (click)="sendFeedback()"
                >
                    {{ sendButtonText() }}
                </button>
            </div>
        </ng-template>
    </div>

    <main class="content">
        <ng-content />

        <a class="link image-credit" routerLink="/user/Mantis">
            Image by
            <span class="text-primary">Mantis</span>
        </a>
    </main>

    <footer class="footer">
        <a routerLink="/privacy">Privacy Policy</a>
        <a routerLink="/terms">Terms</a>
    </footer>
</div>
