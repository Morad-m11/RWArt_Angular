<div ngTabs class="retro-tabs">
    <div ngTabList selectionMode="follow" selectedTab="featured">
        <div ngTab value="featured">Featured</div>
        <div ngTab value="posts">Posts</div>
    </div>

    <div ngTabPanel [preserveContent]="true" value="featured">
        <ng-template ngTabContent>
            <app-featured />
        </ng-template>
    </div>

    <div ngTabPanel [preserveContent]="true" value="posts">
        <ng-template ngTabContent>
            <app-post-list />
        </ng-template>
    </div>
</div>
