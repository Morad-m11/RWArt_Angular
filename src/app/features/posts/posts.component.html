<div ngTabs>
    <div ngTabList selectionMode="follow" selectedTab="search">
        <div ngTab value="featured">Featured</div>
        <div ngTab value="posts">Posts</div>
        <div ngTab value="search">Search</div>
    </div>

    <div ngTabPanel [preserveContent]="true" value="featured">
        <ng-template ngTabContent>
            <app-featured />
        </ng-template>
    </div>

    <div ngTabPanel [preserveContent]="true" value="posts">
        <ng-template ngTabContent>
            <app-post-list />
        </ng-template>
    </div>

    <div ngTabPanel value="search">
        <ng-template ngTabContent>
            <app-search />
        </ng-template>
    </div>
</div>
